<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus ERP Lab • SD Practice Environment</title>
    
    <!-- Google Fonts: Inter (Corporativo) & JetBrains Mono (Códigos, Transações, Tabelas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Metatags e Identidade PWA (Progressive Web App) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#08172c" />
    <meta name="description" content="Ambiente de Treinamento e Simulação Operacional SAP SD" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus ERP Lab" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
    <link rel="shortcut icon" href="./assets/icons/favicon.ico" />

    <!-- Estilos do Design System Corporativo do Simulador -->
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/sidebar.css" />
    <link rel="stylesheet" href="./css/topbar.css" />
    <link rel="stylesheet" href="./css/process-stepper.css" />
    <link rel="stylesheet" href="./css/mentor-dock.css" />
    <link rel="stylesheet" href="./css/transactions.css" />
    <link rel="stylesheet" href="./css/modal.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/journey-views.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <!-- Container Principal do Aplicativo -->
    <div id="root"></div>

    <!-- Registro Seguro do Service Worker PWA com Proteção e Purga de Cache Legado -->
    <script>
      // Purga imediata proativa de quaisquer caches legados (v1, v2)
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key !== 'nexus-erp-lab-v4') {
              caches.delete(key);
              console.log('[PWA] Cache legado purgado:', key);
            }
          });
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registrado com escopo:', reg.scope);
              // Força verificação e ativação imediata de nova versão
              if (reg.active) {
                reg.update();
              }
            })
            .catch((err) => {
              console.warn('[PWA] Falha ao registrar Service Worker:', err);
            });
        });
      }
    </script>

    <!-- Script de Inicialização da Aplicação (Módulos ES6 Nativos) -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
